<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="minsunsoft - Independent game and software developer.">
  <title>minsunsoft</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f2;
      color: #222;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    main {
      width: 100%;
      max-width: 560px;
      padding: 40px 32px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.05);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    p {
      margin: 0;
      font-size: 16px;
      line-height: 1.6;
      color: #666;
    }

    footer {
      margin-top: 28px;
      font-size: 13px;
      color: #999;
    }
  </style>
</head>
<body>
  <main>
    <h1>minsunsoft</h1>
    <p>Independent game and software developer.</p>
    <footer>Copyright © minsunsoft 2026</footer>
  </main>
</body>
</html>
